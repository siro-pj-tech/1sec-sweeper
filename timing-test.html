<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>1SEC 入力タイミング測定</title><link rel="stylesheet" href="css/timing-test.css"></head><body data-timing-mode="light"><main class="light-main"><h1>1SEC 入力タイミング測定</h1><p>いつもの感覚で約1秒押し、離してください。画像を使わない軽い画面で入力を測ります。</p><p>同じ端末で「軽量・ガイドあり／なし」と「ゲーム・ガイドあり／なし」を各10回ほど比較してください。各条件の最初の2回は慣らしとして記録します。</p><div id="lightGuide"><span id="lightBar"></span></div><output id="lightTime">ガイドあり</output><button id="probeAttack" type="button">押して、約1秒で離す</button><p id="lightResult">計測待ち</p><p>結果は端末内に保存します。JSONの保存・共有から取り出せます。自動送信はしません。</p><p><a href="index.html">本番のゲームへ戻る</a></p></main><script src="js/timing-probe.js"></script></body></html>

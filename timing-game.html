<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>入力測定 / 1SEC SWEEPER v1.00 ― 一秒の掃除人</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/timing-test.css"></head>
<body data-timing-mode="game"><main id="app"><header><button id="options" aria-label="オプション">☰</button><div class="brand"><strong>1 SEC <em>SWEEPER</em></strong><small>一秒の掃除人 · v1.00</small></div><span id="wallet">0 G</span></header>
<div class="game-layout"><section id="battle-column"><div id="phaseName">Phase 1 / ビギナー・ストリート</div><nav id="progress" aria-label="フェーズ進行"><img src="assets/images/progressbar.png" alt="4エリアの縮図"><div id="progressFill"></div><div id="progressMarker">◆</div><div id="phaseTicks"><span>1</span><span>2</span><span>3</span><span>4</span></div></nav>
<section id="arena"><canvas id="game" width="960" height="720" aria-label="レナの戦闘画面"></canvas><img id="cutin" src="assets/images/justslash.jpg" alt="" hidden><div id="battleHud" aria-live="polite"><div id="hudGrade"></div><div id="hudTime"></div><div id="hudKills"></div></div><div id="readout" aria-live="polite"></div><div id="overlay"></div><div id="toast" aria-live="polite"></div><img id="alertSweep" src="assets/images/alert-moji.png" alt="緊急警報" hidden><div id="warningBanner" hidden><img src="assets/images/mash-counter-label.png" alt="WARNING! MASH BUTTON!"><svg id="guardDigits" viewBox="0 0 1280 493" aria-label="連打回数00"></svg><div class="steam" aria-hidden="true"></div></div><div id="sceneFade" hidden></div><div id="pauseVeil" hidden>PAUSE</div></section><div class="status-row"><div id="messageBox" role="status"><p id="message1">街を守る、一秒の斬撃。</p><p id="message2">長押しして1秒で離す。</p></div></div><section id="systemDisplay" aria-label="システム専用ディスプレイ"><p id="message3" role="status">防衛装置を保護してください。</p><div id="feverTank"><b id="feverPercent">0%</b><img id="tankBase" src="assets/images/ssystem-tankbase2.png" alt="タンク接続装置"><div class="tank-images"><img src="assets/images/hf-tank-empty.png" alt="フィーバータンク"><img id="tankFull" src="assets/images/hf-tank-max.png" alt=""></div></div></section></section>
<aside id="console">
<div class="utility-row"><button id="pauseButton" class="image-button" aria-label="一時停止"><img src="assets/images/stop-btn.png" alt=""></button><button id="feverButton" class="image-button" aria-label="フィーバーを発動" disabled><img src="assets/images/hf-btn-off.png" alt="フィーバー"></button></div>
<footer id="controls"><button class="arrow" id="left" aria-label="左へ移動"></button><div class="attack-wrap"><span id="attackHint">長押し → 1秒で離す</span><button id="attack"><b>ATTACK</b><strong>1 SEC</strong><small>HOLD & RELEASE</small></button></div><button class="arrow" id="right" aria-label="右へ移動"></button></footer><p class="control-note">A / D・← / →：移動　SPACE：攻撃／ガード連打<br>F：フィーバー　ESC：オプション　P：一時停止</p></aside></div></main>
<dialog id="settings"><button class="close" aria-label="閉じる">×</button><h2>BACKSTREET RADIO</h2><p>街の音と、ひと休み。</p><label>BGM <input id="bgmVolume" type="range" min="0" max="1" step=".05" value=".5"></label><label>SE <input id="seVolume" type="range" min="0" max="1" step=".05" value=".6"></label><button id="previewSE" class="subtle">SEを試聴</button><label><input id="showGuide" type="checkbox"> フェーズ2以降も1秒ガイドを表示</label><label><input id="reduceMotion" type="checkbox"> 画面揺れ・発光を控える</label><fieldset id="musicPlayer"><legend>ミュージックプレイヤー</legend><label for="track">楽曲ファイル</label><select id="track"></select><p id="musicPlayerHint">タイトル画面でのみ選曲できます。</p></fieldset><p id="audioStatus"></p><button id="reset" class="danger">今回の進行を消去してタイトルへ</button><small>保存機能はありません。ページを閉じると進行は消えます。</small></dialog>
<dialog id="epilogue"><div class="episode-heading"><button class="close" aria-label="閉じる" onclick="this.closest('dialog').close()">×</button><h2>エピローグ</h2><p class="muted">下へスクロールしてお読みください。</p></div><div class="episode" tabindex="0"></div></dialog>
<dialog id="lyricsDialog"><div class="episode-heading"><button id="closeLyrics" aria-label="歌詞を閉じる">×</button><h2 id="lyricsTitle"></h2></div><div id="lyricsText" class="episode" tabindex="0"></div></dialog><script src="js/manifest.js"></script><script src="js/game-config.js"></script><script src="js/finale-settings.js"></script><script src="js/finale-config.js"></script><script src="js/lyrics.js"></script><script src="js/control-skin.js"></script><script src="js/episode.js"></script><script src="js/frames.js"></script><script src="js/baby-runtime.js"></script><script src="js/boss-runtime.js"></script><script src="js/rena-runtime.js"></script><script src="js/slime-attack-frame.js"></script><script src="js/battle-messages.js"></script><script src="js/timing-game.js"></script><script src="js/timing-probe.js"></script></body></html>
